apiVersion: apps/v1
kind: Deployment
metadata:
  name: employee-backend
  namespace: production
spec:
  replicas: 2
  selector:
    matchLabels:
      app: employee-backend
  template:
    metadata:
      labels:
        app: employee-backend
    spec:
      containers:
        - name: employee-backend
          image: employee-backend:v2
          imagePullPolicy: Never
          ports:
            - containerPort: 2727
          env:
            - name: DB_HOST
              value: "mysql"
            - name: DB_USER
              value: "root"
            - name: DB_PASSWORD
              value: "password"
            - name: DB_NAME
              value: "employeeSystem"
            - name: DB_PORT
              value: "3306"